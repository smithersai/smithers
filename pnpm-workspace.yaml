# Membership is declared one directory level at a time, under a named parent,
# never with `packages/**` or a bare `packages/*/*`. Packages nest: a granular
# package lives inside the product package it belongs to, so the hierarchy is
# visible in the tree and a reviewer reads the relationship instead of
# inferring it. Nesting changes directories only — every npm name, version,
# dist-tag, and the published set are exactly what they were when the tree was
# flat. The tree splits into apps and packages, never by language: a Rust crate
# is a package like any other and lives under `packages/` beside the package
# that consumes it, so there is no top-level `crates/` (Will, 2026-10-16).
#
# The shape below is what makes that safe. A built package writes a generated
# `dist/cjs/package.json`, which sits TWO levels below its package directory,
# so any pattern with two wildcards in a row (`packages/*/*`, `packages/**`)
# would enrol build output as a workspace member. One wildcard under a named
# parent cannot: nothing one level inside a package directory carries a
# manifest except another package. Adding a parent means adding its line here
# and the identical line to `workspaces` in the root `package.json`.
packages:
  - "packages/*"
  - "packages/smithers/*"
  - "packages/smithers/agent/*"
  - "packages/smithers/agent/harness/benchmarks/*"
  - "packages/smithers/build/*"
  - "packages/smithers/flows/*"
  - "packages/smithers/ui/*"
  - ".smithers/flows"
  - ".smithers/flows/coding"
  - ".smithers/flows/review/seeded-bugs"
  - "apps/*"
  - "evals/*"

allowBuilds:
  "@journeyapps/wa-sqlite": false
  core-js: false
  dprint: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  playwright: false
  sharp: false
  unrs-resolver: false
  vue-demi: false
  workerd: false

linkWorkspacePackages: true
verifyDepsBeforeRun: false
# Test dependencies form intentional package cycles; source cycles have their own gate.
ignoreWorkspaceCycles: true

# Keep transitive prerelease adapters on the same tested Effect family.
overrides:
  "@types/bun": "1.4.4"
  "effect": "4.1.1"
  "@effect/opentelemetry": "4.1.1"
  "@effect/platform-bun": "4.1.1"
  "@effect/platform-node": "4.1.1"
  "@effect/platform-node-shared": "4.1.1"
  "@effect/sql-d1": "4.1.1"
  "@effect/sql-sqlite-bun": "4.1.1"
  "@effect/sql-sqlite-do": "4.1.1"
  "@effect/sql-sqlite-node": "4.1.1"
  "@effect/vitest": "4.1.1"

# @vitest/coverage-v8 5.0.0 remaps native-loader hits against code Vite did not run.
# Remove when an upstream Vitest release fixes coverage of natively loaded copies.
patchedDependencies:
  # @alchemy.run/cloudflare 2.0.0-beta.84 (Alchemy's Cloudflare provider, alchemy/Cloudflare until beta.83):
  # WorkerProvider.diff bundles a Worker from the props Diff.stripEffects returns, which turns its build.input.plugins
  # into undefined, so `alchemy plan` bundled every Worker without its build plugins and failed on .vibe sources. The
  # patch hands hasChanged the Worker's own build options. Delete it with the release that fixes this upstream;
  # apps/mvp/infra/WorkerBundles.test.ts's expected failure says when.
  '@alchemy.run/cloudflare@2.0.0-beta.84': patches/@alchemy.run__cloudflare@2.0.0-beta.84.patch
  # @effect/platform-node-shared 4.1.1: NodeChildProcessSpawner builds the child environment on `{}`, so an env key
  # `__proto__` sets the object's prototype and the child never sees the variable (4.0.x passed env through). The
  # patch builds it with Object.create(null). Effect main (4.1.1) still has the bug; delete the patch with the Effect
  # release that fixes it. flows/kernel's ChildProcessSpawner integration tests cover both env paths.
  '@effect/platform-node-shared@4.1.1': patches/@effect__platform-node-shared@4.1.1.patch
  # @opentelemetry/otlp-transformer 0.222.0: the JSON encoder (toAnyValue) writes every integer as intValue, so
  # Number.MAX_VALUE leaves NodeOtel as `intValue: 1.7976931348623157e+308`, outside OTLP's int64. The SDK's own
  # protobuf serializer and Effect's OtlpResource send it as doubleValue. The patch applies the same int64 range check.
  # 0.300.0 still has the bug; delete the patch with the release that fixes it. flows/observability's NodeOtelBudget
  # "boundary 4" case holds the SDK's JSON body to Effect's encoder.
  '@opentelemetry/otlp-transformer@0.222.0': patches/@opentelemetry__otlp-transformer@0.222.0.patch
  "@vitest/coverage-v8@5.0.0": patches/@vitest__coverage-v8@5.0.0.patch
  # alchemy 2.0.0-beta.84: lib/Auth/OAuthFlow.js and lib/Util/PlatformServices.js import effect/Crypto, which Effect
  # 4.1.0 removed, so every stack import failed with ERR_MODULE_NOT_FOUND. VibeLang's patch (examples/alchemy-stack)
  # moves them to effect/crypto/Digest and SecureRandom in lib/, src/ and the .d.ts files. Local dev also keeps build
  # through stripEffects (LocalProvider) and rehydrates deferred plugin module references after RPC (RpcSerialization),
  # as the beta.83 patch did. Delete the Crypto part with the first alchemy release built on Effect 4.1.
  alchemy@2.0.0-beta.84: patches/alchemy@2.0.0-beta.84.patch
  # TanStack DB's SQLite persistence sends every statement on its own, about 35 to restore one collection, and each is
  # a round trip to the engine worker over SharedSqlite (~2 ms). The patches give its driver `batch` and
  # `transactionBatch` over the database's `executeBatch`, and restore a collection in about five batches: schema once
  # per adapter, its tables in one, and each restore read in one transaction. Delete them when TanStack batches
  # (~/Desktop/UPSTREAM.md); packages/smithers/flows/platform-browser/test/SharedSqliteRestore.test.ts counts requests.
  "@tanstack/db-sqlite-persistence-core@0.4.11": patches/@tanstack__db-sqlite-persistence-core@0.4.11.patch
  "@tanstack/browser-db-sqlite-persistence@0.2.36": patches/@tanstack__browser-db-sqlite-persistence@0.2.36.patch

minimumReleaseAgeExclude:
  # VibeLang is ours (smithersai/vibelang), so its releases need no waiting
  # period. Will approved exempting every vibelang package on 2026-10-21.
  - 'vibelang'
  - 'vibelang-runtime'
  - 'vibelang-vite'
  - 'vibelang-unplugin'
  - 'create-vibelang'
  - 'vibelang-darwin-arm64'
  - 'vibelang-darwin-x64'
  - 'vibelang-linux-arm64'
  - 'vibelang-linux-x64'
  - 'vibelang-win32-arm64'
  - 'vibelang-win32-x64'

# Alchemy publishes declarations importing workers-types but declares it only for development.
# Give its declarations the same exact type dependency as the app, independent of hoisting.
packageExtensions:
  alchemy@2.0.0-beta.83:
    dependencies:
      "@cloudflare/workers-types": "5.20261019.1"
