el, key, kind, id: controls.length, label: options.label,\n        options: options.options, changed: this.changed });\n      send();\n    }\n  };\n  addEventListener(\"message\", event => {\n    if (event.source !== parent || event.data?.type !== \"mvp-design:set\") return;\n    const control = controls[event.data.id];\n    if (!control) return;\n    const value = event.data.value;\n    if (control.kind === \"toggle\" ? typeof value !== \"boolean\" : !control.options.includes(value)) return;\n    control.model[control.key] = value;\n    control.changed();\n    send();\n  });\n  addEventListener(\"DOMContentLoaded\", () => {\n    const sendHeight = () => parent.postMessage({\n      type: \"mvp-design:height\", height: document.documentElement.scrollHeight,\n    }, \"*\");\n    new ResizeObserver(sendHeight).observe(document.body);\n    sendHeight();\n  });\n})();\n<\/script>\n<div id=\"smithers-issue-work\" aria-label=\"Issue investigation and independent flows\">\n  <style>\n    #smithers-issue-work{color-scheme:light dark;--iw-bg:light-dark(#faf9f6,#141413);--iw-panel:light-dark(#fff,#1d1d1a);--iw-fg:light-dark(#24241f,#eeeee7);--iw-muted:light-dark(#62625a,#b4b4a7);--iw-line:light-dark(#dadad0,#3d3d34);--iw-soft:light-dark(#f1f0e8,#29291f);--iw-gold:light-dark(#6b5705,#e6d887);--iw-green:light-dark(#286740,#a5dab1);--iw-red:light-dark(#a52e2b,#ffa59d);--iw-primary:light-dark(#292920,#eeeee5);--iw-on:light-dark(#fff,#22221b);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--iw-fg)}\n    #smithers-issue-work *{box-sizing:border-box;min-width:0}\n    #smithers-issue-work .iw-app{background:var(--iw-bg);border:1px solid var(--iw-line);border-radius:10px;overflow:hidden}\n    #smithers-issue-work .iw-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:15px 22px;border-bottom:1px solid var(--iw-line)}\n    #smithers-issue-work .iw-brand{font:500 15px/1.3 \"IBM Plex Mono\",ui-monospace,monospace;letter-spacing:2px}\n    #smithers-issue-work .iw-repo{c
