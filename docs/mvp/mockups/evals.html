        frame.style.height = Math.min(20000, Math.max(300, event.data.height)) + "px";
      }
      if (event.data?.type !== "mvp-design:controls") return;
      for (const config of event.data.controls) {
        let input = controls.querySelector('[data-control="' + config.id + '"]');
        if (!input) {
          const label = document.createElement("label");
          label.append(document.createTextNode(config.label));
          input = document.createElement(config.kind === "toggle" ? "input" : "select");
          input.dataset.control = config.id;
          input.setAttribute("aria-label", config.label);
          if (config.kind === "toggle") input.type = "checkbox";

            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            input.append(option);
          }
          input.addEventListener("change", () => frame.contentWindow.postMessage({
            type: "mvp-design:set", id: config.id,
            value: config.kind === "toggle" ? input.checked : input.value,
          }, "*"));
          label.append(input);
          controls.append(label);

        if (config.kind === "toggle") input.checked = config.value;
        else input.value = config.value;
      }

ey, kind, id: controls.length, label: options.label,\n        options: options.options, changed: this.changed });\n      send();\n    }\n  };\n  addEventListener(\"message\", event => {\n    if (event.source !== parent || event.data?.type !== \"mvp-design:set\") return;\n    const control = controls[event.data.id];\n    if (!control) return;\n    const value = event.data.value;\n    if (control.kind === \"toggle\" ? typeof value !== \"boolean\" : !control.options.includes(value)) return;\n    control.model[control.key] = value;\n    control.changed();\n    send();\n  });\n  addEventListener(\"DOMContentLoaded\", () => {\n    const sendHeight = () => parent.postMessage({\n      type: \"mvp-design:height\", height: document.documentElement.scrollHeight,\n    }, \"*\");\n    new ResizeObserver(sendHeight).observe(document.body);\n    sendHeight();\n  });\n})();\n<\/script>\n<div id=\"smithers-flow-evals\" aria-label=\"Flow evals and human-reviewed expectations\">\n  <style>\n    #smithers-flow-evals{color-scheme:light dark;--ev-bg:light-dark(#faf9f6,#141413);--ev-panel:light-dark(#fff,#1d1d1a);--ev-fg:light-dark(#25251f,#eeeee7);--ev-muted:light-dark(#626258,#b4b4a7);--ev-line:light-dark(#dadad0,#3d3d34);--ev-soft:light-dark(#efeee6,#29291f);--ev-gold:light-dark(#6b5705,#e6d887);--ev-green:light-dark(#236741,#a1dbb3);--ev-red:light-dark(#a12f2b,#ffaaa2);--ev-primary:light-dark(#282820,#eeeee4);--ev-on:light-dark(#fff,#20201a);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ev-fg)}\n    #smithers-flow-evals *{box-sizing:border-box;min-width:0}\n    #smithers-flow-evals .ev-app{background:var(--ev-bg);border:1px solid var(--ev-line);border-radius:10px;overflow:hidden}\n    #smithers-flow-evals .ev-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:15px 22px;border-bottom:1px solid var(--ev-line)}\n    #smithers-flow-evals .ev-brand{font:500 15px/1.3 \"IBM Plex Mono\",ui-monospace,monospace;letter-spacing:2px}\n    #smithers-flow-evals .ev-repo{color
