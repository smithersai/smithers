<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a756b" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Smithers</title>
    <meta property="og:title" content="Smithers" />
    <meta property="og:description" content="Automate maintaining your codebase" />
    <meta property="og:image" content="__SMITHERS_ORIGIN__/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smithers logo and wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SMITHERS_ORIGIN__/social-card.png" />
    <!-- The first paint is the theme's background, never white, while the app loads (src/features/theme/firstPaint.test.ts
         holds these to @smthrs/ui's default theme). -->
    <style>
      html { background: #f7f4ee; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0d1514; } }
      html[data-theme="dark"] { background: #0d1514; }
      /* The first paint (src/firstPaint/shell.ts): a cold issue page's heading or list, over the page until it shows. */
      #first-paint { position: fixed; inset: 0; z-index: 2147483000; overflow: auto; background: #f7f4ee; color: #1c2624;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) #first-paint { background: #0d1514; color: #e3ebe8; } }
      html[data-theme="dark"] #first-paint { background: #0d1514; color: #e3ebe8; }
      #first-paint[hidden] { display: none; }
      #first-paint .first-paint-body { max-width: 72rem; margin: 0 auto; padding: 4.5rem 1.5rem; }
      /* Once the app has rendered anything to act on, the paint sits in its flow and covers nothing. */
      #first-paint[data-placed] { position: static; inset: auto; z-index: auto; overflow: visible; background: none; }
      #first-paint[data-placed] .first-paint-body { padding: 0.5rem 1rem; max-width: none; }
      #first-paint[data-placed] .first-paint-repo, #first-paint[data-placed] .first-paint-list-title { display: none; }
      #first-paint h1 { font-size: 1.5rem; line-height: 1.3; margin: 0.5rem 0; overflow-wrap: anywhere; }
      #first-paint .first-paint-repo, #first-paint .first-paint-meta, #first-paint li span { opacity: 0.7; margin: 0; }
      #first-paint input { font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 0.375rem; padding: 0.5rem 0.75rem; width: min(100%, 24rem); }
      #first-paint ul { list-style: none; padding: 0; margin: 1rem 0; }
      #first-paint li { padding: 0.5rem 0; border-bottom: 1px solid rgba(127, 127, 127, 0.2); overflow-wrap: anywhere; }
      #first-paint a { color: inherit; font-weight: 600; text-decoration: none; }
      /* Edge-rendered first paint inside #root (worker/edgeFirstPaint.ts): painted at CDN speed, replaced seamlessly when React mounts. */
      .edge-shell { color: #1c2624; font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .edge-shell { color: #e3ebe8; } }
      html[data-theme="dark"] .edge-shell { color: #e3ebe8; }
      .edge-landing { min-height: 100dvh; padding: 0 1.25rem 2rem; display: flex; flex-direction: column; text-align: center; box-sizing: border-box; }
      .edge-landing-top { display: flex; align-items: center; justify-content: flex-end; gap: 1.25rem; padding-top: 1rem; font-size: 0.925rem; }
      .edge-landing-top a, .edge-shell a { color: inherit; text-decoration: none; }
      .edge-landing-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; }
      .edge-landing h1 { margin: 0; font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
      .edge-landing-tagline { max-width: 52rem; margin: 0 0 1rem; font-size: clamp(1.25rem, 2.6vw, 1.8rem); opacity: 0.72; }
      .edge-landing-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.9rem; }
      .edge-btn { display: inline-flex; align-items: center; padding: 0.65rem 1.25rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.95rem; border: 1px solid rgba(127, 127, 127, 0.35); }
      .edge-btn-solid { background: #3a756b; color: #f7f4ee !important; border-color: #3a756b; }
      .edge-repo { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; box-sizing: border-box; }
      .edge-repo-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(127, 127, 127, 0.2); margin-bottom: 1.25rem; }
      .edge-repo-header h1 { margin: 0; font-size: 1.35rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
      .edge-repo-desc { margin: 0.5rem 0 1.25rem; opacity: 0.78; max-width: 56rem; }
      .edge-repo-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.875rem; opacity: 0.7; margin-bottom: 1.25rem; }
      .edge-repo-card { border: 1px solid rgba(127, 127, 127, 0.22); border-radius: 0.625rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
      .edge-repo-card h2 { margin: 0 0 0.4rem; font-size: 1.15rem; font-weight: 600; }
      .edge-repo-card p { margin: 0.25rem 0; opacity: 0.85; }
      .edge-repo-list { list-style: none; padding: 0; margin: 0; }
      .edge-repo-list li { display: flex; align-items: center; gap: 0.6rem; padding: 0.42rem 0; border-bottom: 1px solid rgba(127, 127, 127, 0.14); font-size: 0.925rem; }
      .edge-repo-list li:last-child { border-bottom: none; }
      .edge-repo-kind { opacity: 0.55; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; width: 2.2rem; }
      .edge-repo-links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
      .edge-repo-links a { font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
    </style>
    <script>
      // Resolve this device's theme before any route opens. A system default is only painted, never saved as a choice.
      let mode
      try {
        mode = localStorage.getItem("smithers.theme")
      } catch {}
      if (mode !== "light" && mode !== "dark") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      document.documentElement.setAttribute("data-theme", mode)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
