<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a756b" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Smithers</title>
    <meta property="og:title" content="Smithers" />
    <meta property="og:description" content="Automate maintaining your codebase" />
    <meta property="og:image" content="__SMITHERS_ORIGIN__/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smithers logo and wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SMITHERS_ORIGIN__/social-card.png" />
    <!-- The first paint is the theme's background, never white, while the app loads (src/features/theme/firstPaint.test.ts
         holds these to @smthrs/ui's default theme). -->
    <style>
      html { background: #f7f4ee; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0d1514; } }
      html[data-theme="dark"] { background: #0d1514; }
      /* The first paint (src/firstPaint/shell.ts): a cold issue page's heading or list, over the page until it shows. */
      #first-paint { position: fixed; inset: 0; z-index: 2147483000; overflow: auto; background: #f7f4ee; color: #1c2624;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) #first-paint { background: #0d1514; color: #e3ebe8; } }
      html[data-theme="dark"] #first-paint { background: #0d1514; color: #e3ebe8; }
      #first-paint[hidden] { display: none; }
      #first-paint .first-paint-body { max-width: 72rem; margin: 0 auto; padding: 4.5rem 1.5rem; }
      /* Once the app has rendered anything to act on, the paint sits in its flow and covers nothing. */
      #first-paint[data-placed] { position: static; inset: auto; z-index: auto; overflow: visible; background: none; }
      #first-paint[data-placed] .first-paint-body { padding: 0.5rem 1rem; max-width: none; }
      #first-paint[data-placed] .first-paint-repo, #first-paint[data-placed] .first-paint-list-title { display: none; }
      #first-paint h1 { font-size: 1.5rem; line-height: 1.3; margin: 0.5rem 0; overflow-wrap: anywhere; }
      #first-paint .first-paint-repo, #first-paint .first-paint-meta, #first-paint li span { opacity: 0.7; margin: 0; }
      #first-paint ul { list-style: none; padding: 0; margin: 1rem 0; }
      #first-paint li { padding: 0.5rem 0; border-bottom: 1px solid rgba(127, 127, 127, 0.2); overflow-wrap: anywhere; }
      #first-paint a { color: inherit; font-weight: 600; text-decoration: none; }
    </style>
    <script>
      // Resolve this device's theme before any route opens. A system default is only painted, never saved as a choice.
      let mode
      try {
        mode = localStorage.getItem("smithers.theme")
      } catch {}
      if (mode !== "light" && mode !== "dark") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      document.documentElement.setAttribute("data-theme", mode)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
