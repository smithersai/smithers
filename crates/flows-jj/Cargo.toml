[package]
name = "flows-jj"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "The flows `Jj` contract ops over jj-lib, exported as a wasm32-wasip1 reactor ABI"

[lib]
# `cdylib` produces the wasm32-wasip1 reactor module (`flows_jj.wasm`);
# `rlib` keeps the crate linkable for native `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
bstr = { version = "1.12.1", default-features = false, features = ["std"] }
futures = "0.3.32"
jj-lib = { workspace = true }
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.27.0"
