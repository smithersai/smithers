# The live proof for @smthrs/opencode: one real turn, on a real seat, judged by
# a real Jev key, against a real git repository with a planted one-character bug.
#
# WHY THIS IS NOT A ci.yml JOB. ci.yml is generated from PACKAGE.ts and every
# step it can carry is `smthrs <verb> <target>`. The build executor hands a
# child process only the bootstrap variables in
# `packages/smithers/build/targets/src/Exec.ts` (`inheritedEnvironmentNames`)
# plus what the declaration states, and a declared secret reaches a tool as an
# unguessable placeholder that the proxy substitutes for plain HTTP or a
# capability URL only. An HTTPS CONNECT stream is left opaque on purpose
# (`SecretProxy.ts`), so a seat key cannot reach api.cerebras.ai through it.
# Run under `smthrs test`, `test/LiveBugFix.test.ts` therefore reports
# "Live turn skipped" with both keys exported, which is a green gate that
# proved nothing. This workflow runs the suite directly instead, the way
# reliability.yml and canary.yml run the work the target graph cannot express.
#
# COST. One turn is about one cent (seat plus Jev) and about ten seconds of
# model time. It runs on a push to main that touches the server, its CLI verb,
# or the harness that judges completions, and on demand. It never runs on a
# pull request: a fork has no secrets, so the job would either fail on every
# contributor's branch or spend the maintainer's credit on their code.
#
# NO SILENT SKIP. The suite exits 0 when a key is absent, so absence is checked
# twice: once before the install, and once after the run against the line the
# turn itself prints. A rotated secret fails this job loudly instead of turning
# it into a no-op.
#
# WHY IT MAY RUN THE TURN TWICE. Every failure in the drive is the server's
# except one: whether the cheap seat `cerebras:gpt-oss-120b` gets the right
# answer. A normally settled turn that leaves `add.mjs` unchanged gets one
# second attempt. Every server assertion runs before that decision, and an
# errored turn, including one whose completion was refused, is never retried.
# A gate that reds for a reason unrelated to the
# change under test teaches people to ignore it, so the suite gives the seat
# one second attempt, on a fresh repository and a fresh server, and fails with
# both reasons when both attempts leave the bug in place. Nothing else is
# retried: a boot that never came up, a turn that never went idle, a
# completion Jev could not judge, a protocol shape that does not hold and a
# health dot that does not settle green all fail on the first attempt. The
# retry is never silent, and the step below turns it into a run annotation.
#
# LINTING. PACKAGE.ts names this file in ci.yml's actionlint step, and
# apps/server/scripts/canary/workflow-wiring.test.ts fails when a workflow is
# missing from that list.
name: Live OpenCode turn

on:
  push:
    branches: [main]
    paths:
      - 'packages/smithers/opencode/**'
      - 'packages/smithers/src/commands/OpenCode.ts'
      - 'packages/smithers/agent/harness/**'
      - '.github/workflows/live-opencode.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-turn:
    name: one live turn fixes a planted bug
    # A fork's push carries no secrets, and this job spends money.
    if: github.repository == 'smithersai/smithers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to start without the two keys the turn needs
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          missing=''
          if [ -z "${AI_GATEWAY_API_KEY}" ]; then
            missing="${missing} AI_GATEWAY_API_KEY (the Jev key that judges the completion)"
          fi
          if [ -z "${CEREBRAS_API_KEY}" ]; then
            missing="${missing} CEREBRAS_API_KEY (the seat that runs the turn)"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::This job proves nothing without a key. Add the repository secret:${missing}"
            exit 1
          fi
          echo 'Both keys are present.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: One live turn, judged
        working-directory: packages/smithers/opencode
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        # Coverage is off: this one file imports nothing from `src`, and the
        # package's own `test` target stays the 100% coverage gate.
        run: |
          set -o pipefail
          pnpm exec vitest run test/LiveBugFix.test.ts \
            --coverage.enabled=false --reporter=verbose 2>&1 | tee "${RUNNER_TEMP}/live-turn.log"
          if ! grep -q 'live turn: booted in' "${RUNNER_TEMP}/live-turn.log"; then
            echo '::error::The turn did not run. The suite skipped it, so this job proved nothing.'
            exit 1
          fi
          if grep -q 'live turn: retrying once' "${RUNNER_TEMP}/live-turn.log"; then
            echo '::notice::Green on the second attempt. The seat failed the planted bug once and the server passed every check both times; the uploaded log names the reason.'
          fi
      - name: Keep the turn's own report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-opencode-turn
          path: ${{ runner.temp }}/live-turn.log
          if-no-files-found: warn
