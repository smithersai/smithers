        with:
          "persist-credentials": "false"
      - name: "Install Go"
        uses: "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
        with:
          "go-version": "1.26.8"
      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09"
