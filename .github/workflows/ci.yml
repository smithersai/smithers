        uses: "taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b"
        with:
          "tool": "jj-cli@0.39.0"
      - name: "Initialize colocated jj repository"
        run: "jj git init --colocate"
      - name: "Install ripgrep"
        uses: "taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b"
        with:
          "tool": "ripgrep@14.1.1"
      - name: "Install system packages"
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap' 'ffmpeg' 'openssh-server'
