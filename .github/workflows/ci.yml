        shell: "bash"
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          "persist-credentials": "false"
      - name: "Validate GitHub Actions workflows"
        uses: "docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f"
        with:
          "args": ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/release-auth.yml .github/workflows/npm-dist-tag.yml .github/workflows/distribution.yml .github/workflows/reliability.yml .github/workflows/native-windows.yml .github/workflows/drift.yml"
      - name: "Install Go"
        uses: "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
        with:
          "go-version": "1.26.8"
      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09"
        with:
          "version": "v1.8.1"
      - name: "Enable the containerd image store"
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ]; then
            current='{}'
