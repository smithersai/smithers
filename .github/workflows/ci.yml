name: "CI"
on:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  "test":
    name: "workspace graph (coverage gates enforced)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 40
    steps:
      - name: "Start smthrs results"
        run: "mkdir -p \"$RUNNER_TEMP/smthrs-results\" && printf '%s\\n' '{\"version\":1,\"results\":[]}' > \"$RUNNER_TEMP/smthrs-results/attempt.json\""
        shell: "bash"
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          "persist-credentials": "false"
      - name: "Validate GitHub Actions workflows"
        uses: "docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f"
        with:
          "args": ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/release-auth.yml .github/workflows/npm-dist-tag.yml .github/workflows/distribution.yml .github/workflows/reliability.yml .github/workflows/native-windows.yml .github/workflows/drift.yml"
      - name: "Install Go"
        uses: "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff"
        with:
          "go-version": "1.26.8"
      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09"
        with:
          "version": "v1.8.1"
      - name: "Enable the containerd image store"
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ]; then
            current='{}'
            if [ -f /etc/docker/daemon.json ]; then current="$(cat /etc/docker/daemon.json)"; fi
            merged="$(printf '%s\n' "$current" | jq --argjson mirrors '["https://mirror.gcr.io"]' '.features["containerd-snapshotter"] = true | (.["registry-mirrors"] // []) as $have | .["registry-mirrors"] = $have + ($mirrors - $have)')"
            if [ "$(printf '%s\n' "$current" | jq -cS .)" != "$(printf '%s\n' "$merged" | jq -cS .)" ]; then
              printf '%s\n' "$merged" | sudo tee /etc/docker/daemon.json >/dev/null
              sudo systemctl restart docker
            fi
            docker info --format 'docker storage driver: {{.Driver}}; registry mirrors: {{.RegistryConfig.Mirrors}}'
          fi
        shell: "bash"
      - uses: "pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86"
      - uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          "node-version-file": ".node-version"
          "cache": "pnpm"
      - name: "Install certified npm"
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: "bash"
      - uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          "bun-version": "1.4.1"
      - run: "pnpm install --frozen-lockfile --ignore-scripts"
      - uses: "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
      - name: "Install native smithers-jj-export"
        run: |
          case "$(uname -s)" in Linux|Darwin|MINGW*|MSYS*)
            native_suffix=''
            case "$(uname -s)" in MINGW*|MSYS*) native_suffix='.exe';; esac
            rustup toolchain install '1.98.0' --profile minimal
            cargo +1.98.0 build --locked -p 'smithers-ffi' --bin 'smithers-jj-export'
            mkdir -p "$RUNNER_TEMP/smithers-native"
            native_path="$RUNNER_TEMP/smithers-native/smithers-jj-export$native_suffix"
            install -m 755 "target/debug/smithers-jj-export$native_suffix" "$native_path"
            if [ "$native_suffix" = '.exe' ]; then native_path="$(cygpath -w "$native_path")"; fi
            printf '%s=%s\n' 'SMITHERS_WORKSPACE_JJ_EXPORT_BINARY' "$native_path" >> "$GITHUB_ENV"
          esac
        shell: "bash"
      - name: "Install jj"
        uses: "taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b"
        with:
          "tool": "jj-cli@0.39.0"
      - name: "Initialize colocated jj repository"
        run: "jj git init --colocate"
      - name: "Install ripgrep"
        uses: "taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b"
        with:
          "tool": "ripgrep@14.1.1"
      - name: "Install system packages"
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap' 'ffmpeg'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: "bash"
      - name: "Install PostgreSQL"
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-common
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
              echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
              sudo apt-get install -y -qq --no-install-recommends 'postgresql-18'
              pg_bin=/usr/lib/postgresql/18/bin path_entry="$pg_bin" floor=18
              ;;
            Darwin)
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet 'postgresql@18'
              pg_bin="$(brew --prefix 'postgresql@18')/bin" path_entry="$pg_bin" floor=18
              ;;
            MINGW*|MSYS*)
              pg_bin="$(cygpath -u "${PGBIN:?the runner image names no PostgreSQL in PGBIN}")" path_entry="$PGBIN" floor=17
              ;;
            *) echo "no PostgreSQL install for $(uname -s)" >&2; exit 1 ;;
          esac
          version="$("$pg_bin/initdb" --version)"
          major="${version#*) }"
          major="${major%%[!0-9]*}"
          if [ -z "$major" ] || [ "$major" -lt "$floor" ]; then
            echo "$version is not PostgreSQL $floor or later" >&2
            exit 1
          fi
          echo "$version"
          printf '%s\n' "$path_entry" >> "$GITHUB_PATH"
        shell: "bash"
      - name: "Install Playwright browsers"
        id: setup
        run: |
          cd 'packages/smithers/ui'
          pnpm exec playwright install --with-deps 'chromium' 'webkit'
        shell: "bash"
      - name: "Workspace targets"
        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs ci '//packages/smithers:*' --jobs 2 --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        shell: "bash"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
          "MSYS2_ARG_CONV_EXCL": "//"
      - name: "Upload smthrs results"
        if: always()
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          "name": "smthrs-results-test-0-${{ github.run_attempt }}"
          "path": "${{ runner.temp }}/smthrs-results"
          "if-no-files-found": "error"
