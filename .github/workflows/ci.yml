        if: ${{ !cancelled() && steps.setup.conclusion == 'success' }}
        run: "pnpm exec smthrs ci '//packages/effect-tanstack-db:*' '//packages/smithers/agent/model:*' '//packages/smithers/agent/scorers:*' '//packages/smithers/agent/triggers:*' '//packages/smithers/flows/core:*' '//packages/smithers/flows/engine:*' '//packages/smithers/flows/flow:*' '//packages/smithers/flows/merge-queue:*' '//packages/smithers/flows/platform-browser:*' --jobs 2 --known-red '.github/ci-known-red.json' --results-file \"$RUNNER_TEMP/smthrs-results/$GITHUB_ACTION.json\" --verbose"
        shell: "bash"
        env:
          "SMITHERS_CACHE_URL": "${{ secrets.SMITHERS_CACHE_URL }}"
          "SMITHERS_CACHE_READ_TOKEN": "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          "SMITHERS_CACHE_NAMESPACE": "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
          "MSYS2_ARG_CONV_EXCL": "//"
      - name: "Upload smthrs results"
        if: always()
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          "name": "smthrs-results-test-4-0-${{ github.run_attempt }}"
          "path": "${{ runner.temp }}/smthrs-results"
          "if-no-files-found": "error"
