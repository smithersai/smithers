name: Windows filesystem
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-windows.yml
      - crates/smithers-ffi/src/atomic_windows_handle.rs
      - crates/smithers-ffi/src/lib.rs
      - crates/smithers-ffi/Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/native-windows.yml
      - crates/smithers-ffi/src/atomic_windows_handle.rs
      - crates/smithers-ffi/src/lib.rs
      - crates/smithers-ffi/Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-filesystem-${{ github.ref }}
  cancel-in-progress: false
jobs:
  filesystem:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-filesystem
      - name: Test native filesystem boundaries
        run: cargo +1.98.0 test --locked -p smithers-ffi --lib atomic_windows_handle::tests -- --nocapture
