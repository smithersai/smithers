name: Windows filesystem
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-windows.yml
      - "crates/smithers-ffi/src/**/*.rs"
      - "crates/smithers-ffi/tests/**/*.rs"
      - "packages/smithers/flows/platform-node/**"
      - pnpm-lock.yaml
      - crates/smithers-ffi/Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/native-windows.yml
      - "crates/smithers-ffi/src/**/*.rs"
      - "crates/smithers-ffi/tests/**/*.rs"
      - "packages/smithers/flows/platform-node/**"
      - pnpm-lock.yaml
      - crates/smithers-ffi/Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-filesystem-${{ github.ref }}
  cancel-in-progress: false
jobs:
  filesystem:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-filesystem
      - name: Test native filesystem boundaries
        run: cargo +1.98.0 test --locked -p smithers-ffi --lib atomic_windows_ -- --nocapture
      - name: Build Windows helper
        run: cargo +1.98.0 build --locked -p smithers-ffi --bin smithers-jj-export
      - name: Test filesystem through the helper modules
        run: cargo +1.98.0 test --locked -p smithers-ffi --bin smithers-jj-export atomic_ -- --nocapture
      - name: Test workspace file recovery
        run: cargo +1.98.0 test --locked -p smithers-ffi --bin smithers-jj-export workspace_files::tests -- --nocapture
      - name: Verify managed guest authority is unavailable locally
        run: cargo +1.98.0 test --locked -p smithers-ffi --bin smithers-jj-export local_windows_host_cannot_acquire_managed_unix_guest_credentials
      - name: Test executable filesystem protocol
        run: cargo +1.98.0 test --locked -p smithers-ffi --test atomic_fs_cli -- --nocapture
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0,ripgrep@14.1.1
      - name: Install Node workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Expose the built Windows helper
        run: |
          $helper = (Resolve-Path target/debug/smithers-jj-export.exe).Path
          "SMITHERS_WORKSPACE_JJ_EXPORT_BINARY=$helper" >> $env:GITHUB_ENV
      - name: Test the complete Node host suite
        run: pnpm --dir packages/smithers/flows/platform-node exec vitest run
