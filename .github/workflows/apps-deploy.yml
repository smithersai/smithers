name: Deploy apps

# Every push to main deploys smithers.sh, after the apps gates pass on that
# exact sha. This is the one deploy path (apps/server/DEPLOY.md "CI (every
# push to main)"). scripts/deploy.ts refuses a real deploy of any commit that
# is dirty or not on origin/main, whoever runs it.
on:
  push:
    branches: [main]
  # A manual run is a credential-free rehearsal: the gates, then the dry-run
  # deploy.
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time, never cancelled mid-publish. GitHub keeps one pending
# run per group and replaces it on each push, so under load the newest main
# deploys next and the shas between are skipped, never published out of order.
concurrency:
  group: apps-deploy
  cancel-in-progress: false

jobs:
  # The apps gates ci.yml's apps-e2e job runs, by the same target labels, on
  # the sha this run deploys. ci.yml on main is superseded before most runs
  # start, so the deploy cannot wait on it. This job never sees the Cloudflare
  # credential: environment secrets reach only the job that names the
  # environment. apps/server/scripts/canary/workflow-wiring.test.ts holds
  # these targets to a superset of apps-e2e's.
  gate:
    name: apps gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SMITHERS_CACHE_URL: ${{ secrets.SMITHERS_CACHE_URL }}
      SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install certified npm
        shell: bash
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native smithers-jj-export
        shell: bash
        run: |
          rustup toolchain install '1.98.0' --profile minimal
          cargo +1.98.0 build --locked -p 'smithers-ffi' --bin 'smithers-jj-export'
          mkdir -p "$RUNNER_TEMP/smithers-native"
          install -m 755 'target/debug/smithers-jj-export' "$RUNNER_TEMP/smithers-native/smithers-jj-export"
          printf '%s=%s\n' 'SMITHERS_WORKSPACE_JJ_EXPORT_BINARY' "$RUNNER_TEMP/smithers-native/smithers-jj-export" >> "$GITHUB_ENV"
      - name: Install jj
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Install ripgrep
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: ripgrep@14.1.1
      - name: Install system packages
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: UI typecheck
        run: pnpm exec smthrs build '//apps/app:check' --verbose
      - name: UI unit tests
        run: pnpm exec smthrs test '//apps/app:unitTests' --verbose
      - name: UI conformance lint
        run: pnpm exec smthrs test '//apps/app:conformance' --verbose
      - name: UI browser end-to-end suite
        run: pnpm exec smthrs test '//apps/app:browserE2e' --verbose
      - name: Server typecheck and tests
        run: pnpm exec smthrs ci '//apps/server/...' --verbose
      - name: Site build and tests
        run: pnpm exec smthrs ci '//apps/site/...' --verbose
      - name: Collect e2e artifacts
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          cp /tmp/smithers-*.png "$RUNNER_TEMP/e2e-artifacts/" 2>/dev/null || true
          cp -R apps/reports "$RUNNER_TEMP/e2e-artifacts/reports" 2>/dev/null || true
          cp -R apps/app/test-results "$RUNNER_TEMP/e2e-artifacts/playwright-test-results" 2>/dev/null || true
          cp -R apps/app/playwright-report "$RUNNER_TEMP/e2e-artifacts/playwright-report" 2>/dev/null || true
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apps-deploy-e2e-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  deploy:
    name: build + wrangler deploy
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # Full history: scripts/deploy.ts checks that HEAD is an ancestor of
      # origin/main, and a shallow clone has no origin/main history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A real deploy needs a push AND the production environment's
      # Cloudflare credential; a manual run, or a push before the credential
      # exists, proves the pipeline with --dry-run instead. The Worker
      # identity (smithers-mvp-web) is frozen (apps/server/DEPLOY.md); this
      # workflow never edits wrangler.jsonc.
      - name: Decide dry-run mode
        id: mode
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
      # CN-23 reads the allowlist back with the identity service token and the
      # roster variable. With neither configured it can assert nothing, so it
      # does not run and a warning says so. With either one it runs, and a
      # missing half fails it as `CN-23 ASSERTED NOTHING`. Decided here, before
      # any probe, so a red CN-1 cannot leave both CN-23 steps skipped.
      - name: Decide whether CN-23 can read the allowlist
        id: invite
        env:
          HAS_SERVICE_TOKEN: ${{ secrets.IDENTITY_SERVICE_TOKEN != '' }}
          HAS_ROSTER: ${{ vars.CANARY_ALLOWLIST_LOGINS != '' }}
        run: |
          if [ "$HAS_SERVICE_TOKEN" = "true" ] || [ "$HAS_ROSTER" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy (dry-run)
        id: deploy_dry
        if: steps.mode.outputs.dry_run == 'true'
        run: pnpm --filter smithers-server run deploy:dry
      # Only the Cloudflare credentials. The Worker's secrets are set once on
      # the live script with `wrangler secret put` and every `wrangler deploy`
      # keeps them (`keep_bindings`), so nothing else is exported here: a
      # repository secret listed in this env would be ignored by the deploy and
      # would tell the next operator the deploy needs it. `SMITHERS_BUILD_SHA`
      # is not a binding either; scripts/deploy.ts bakes it into the site build.
      # apps/server/scripts/deploy-docs.test.ts holds this env to that rule.
      - name: Deploy (real)
        id: deploy_real
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter smithers-server run deploy
      # --- Post-deploy verification ---------------------------------------
      #
      # E2E-CANARY-CHECKLIST CN-1, CN-18, CN-23 and CN-24.
      # apps/server/scripts/canary/workflow-wiring.test.ts fails if a probe
      # loses its caller.
      #
      # These grade this job's outcome (the sha just published, the upstreams
      # the new Worker proxies, the entry path, the rollback target), so a red
      # one reds this run, which is the audience that can act on it. canary.yml
      # is the scheduled home for continuous liveness. They verify what
      # shipped; they cannot prevent it.
      #
      # Every probe carries `!cancelled()` so one red probe does not skip the
      # others, and keys off the deploy steps' `outcome` so none runs against a
      # deploy that failed or was skipped. A red probe still fails the job.
      - name: CN-1 — the deployment serves the sha it just published
        if: ${{ !cancelled() && steps.deploy_real.outcome == 'success' }}
        working-directory: apps/server
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          REPORT: ${{ runner.temp }}/canary-build.json
        run: |
          set -uo pipefail
          # --sha is what makes the comparison real: without it the probe
          # verifies only that the deployment can state what it is. There is
          # no drift bound: a newer push is the next queued deploy, not a
          # defect of this one.
          #
          # Cloudflare returns from the deploy call before every edge serves the
          # new asset, so three reads over 40 seconds.
          for attempt in 1 2 3; do
            if bun scripts/canary/build-probe.ts https://canary.smithers.sh \
              --sha "$DEPLOYED_SHA" \
              --json "$REPORT"; then
              exit 0
            fi
            if [ "$attempt" != 3 ]; then
              echo "CN-1 attempt $attempt did not match; waiting for the rollout." >&2
              sleep 20
            fi
          done
          echo "CN-1: canary.smithers.sh is not serving $DEPLOYED_SHA." >&2
          exit 1
      # A skipped check has to say so out loud: a silently absent step and a
      # passing one look identical in the Actions list.
      - name: CN-1 not run (dry-run deploy)
        if: ${{ !cancelled() && steps.deploy_dry.outcome == 'success' }}
        run: |
          set -euo pipefail
          echo "::warning title=CN-1 not run::This job deployed nothing, so canary.smithers.sh still serves an earlier commit and its sha is not this run's to assert."
          echo "- CN-1 build-stamp probe: NOT RUN — dry-run deploy (a manual run, or CLOUDFLARE_API_TOKEN is unset in the production environment)." >> "$GITHUB_STEP_SUMMARY"
      # The site's pages and 404, the app document with its isolation headers,
      # a frame path reload, the Worker answering /api/* before the assets
      # layer, and every legacy Mintlify path. Anonymous GETs only.
      - name: Site probe (the deployment serves the site, the app document, and the legacy aliases)
        if: ${{ !cancelled() && steps.deploy_real.outcome == 'success' }}
        working-directory: apps/server
        env:
          REPORT: ${{ runner.temp }}/canary-site.json
        run: bun scripts/canary/site-probe.ts canary.smithers.sh --json "$REPORT"
      # No credential; the origins are committed in workers-manifest.ts so a
      # wrong one cannot hide in a secret. Upstream health does not depend on
      # whether this job deployed, so it runs on the dry-run path too.
      - name: CN-18 — the backing Workers answer
        if: ${{ !cancelled() && (steps.deploy_real.outcome == 'success' || steps.deploy_dry.outcome == 'success') }}
        working-directory: apps/server
        run: bun scripts/canary/workers-health.ts
      # Read-only half only; the write half mutates the production allowlist
      # and stays a human drill in apps/server/INVITES.md. Runs when the
      # `invite` step found the service token or the roster; a missing half is
      # red, the probe's own ruling (invite-verdict.ts). Do not add
      # continue-on-error. IDENTITY_UPSTREAM_URL is not set: an unset variable
      # expands to "" and would override the probe's default origin.
      - name: CN-23 — the closed-alpha entry path
        if: ${{ !cancelled() && (steps.deploy_real.outcome == 'success' || steps.deploy_dry.outcome == 'success') && steps.invite.outputs.configured == 'true' }}
        working-directory: apps/server
        env:
          IDENTITY_SERVICE_TOKEN: ${{ secrets.IDENTITY_SERVICE_TOKEN }}
          CANARY_ALLOWLIST_LOGINS: ${{ vars.CANARY_ALLOWLIST_LOGINS }}
        run: bun scripts/canary/invite-probe.ts
      - name: CN-23 not run (no identity credential or roster)
        if: ${{ !cancelled() && (steps.deploy_real.outcome == 'success' || steps.deploy_dry.outcome == 'success') && steps.invite.outputs.configured == 'false' }}
        run: |
          set -euo pipefail
          echo "::warning title=CN-23 not run::Neither the IDENTITY_SERVICE_TOKEN secret nor the CANARY_ALLOWLIST_LOGINS variable is set, so the allowlist seed was not read back."
          echo "- CN-23 allowlist seed probe: NOT RUN — IDENTITY_SERVICE_TOKEN and CANARY_ALLOWLIST_LOGINS are unset (apps/server/INVITES.md)." >> "$GITHUB_STEP_SUMMARY"
      # Reads the receipt the deploy step just wrote (deploy-receipts/latest.json),
      # so it means something only on the real-deploy path. The probe exits 0
      # when it verified nothing, so that becomes a warning here.
      - name: CN-24 — a rollback target still exists
        if: ${{ !cancelled() && steps.deploy_real.outcome == 'success' }}
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOG: ${{ runner.temp }}/canary-rollback.log
        run: |
          set -euo pipefail
          bun scripts/canary/rollback-probe.ts | tee "$LOG"
          if ! grep -q "ROLLBACK PROBE PASS" "$LOG"; then
            echo "::warning title=CN-24 verified nothing::The rollback probe found no receipt or no Cloudflare credential. Nothing here proves a rollback target exists."
            echo "- CN-24 rollback readiness: NOT VERIFIED — see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the canary probe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-probe-reports
          path: |
            ${{ runner.temp }}/canary-build.json
            ${{ runner.temp }}/canary-site.json
            ${{ runner.temp }}/canary-rollback.log
          if-no-files-found: ignore
      - name: Upload deploy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-receipt
          path: apps/server/deploy-receipts/**/*.json
          if-no-files-found: warn
