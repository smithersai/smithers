# Point an npm dist-tag of one package this repository publishes at a version
# already on npm.
#
# A release publishes a prerelease under `next`, and moves `latest` only for
# the packages people run by bare name (`smithers-ci`; see runByName in
# .smithers/flows/release/publish-release.mjs). When `latest` of another
# package must follow a published prerelease, a maintainer runs:
#
#   gh workflow run npm-dist-tag.yml -f package=@smthrs/flows -f version=1.0.0-rc.8 -f tag=latest
#
# It checks out the release scripts and publishes nothing. Its only write is
# `npm dist-tag add`, made with the NPM_TOKEN repository secret, the npm
# credential release-auth.yml verifies. Only npm itself is given that secret:
# the one script of the checkout runs first, without it.
#
# GUARDS, all checked before the write:
# - the run is this repository's own copy of this file on `main`.
# - `package` is one a release publishes: the list in
#   .smithers/flows/release/published-packages.mjs, which the release packs
#   from. `smithers-orchestrator`, a 0.x name the release does not publish,
#   is refused.
# - `version` is an exact version, published under that package.
# - `tag` is a lowercase word.
# - `tag: latest` is refused while the package's current `latest` is a 0.x
#   version, the same rule release.yml applies to prereleases, unless
#   `replaceZeroLatest` is true.
#
# The log prints the dist-tags before and after the move.
#
# LINTING. ci.yml names this file in its actionlint step, and release.yml
# copies that step.
name: Move an npm dist-tag
run-name: npm dist-tag ${{ inputs.tag }} ${{ inputs.package }}@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: "A package a release publishes, such as smithers-ci or @smthrs/cli"
        required: true
        type: string
      version:
        description: "Exact version already on npm, such as 1.0.0-rc.8"
        required: true
        type: string
      tag:
        description: "Dist-tag to point at that version, such as latest"
        required: true
        type: string
      replaceZeroLatest:
        description: "Move latest even when it is a 0.x version that 0.x users install"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-dist-tag-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  move:
    name: Move the dist-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    env:
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      REPLACE_ZERO_LATEST: ${{ inputs.replaceZeroLatest }}
    steps:
      # The reviewed copy of this file only. A dispatch from another branch
      # runs that branch's copy of this workflow and of the release scripts,
      # so it stops here, before anything is checked out.
      - name: Require the reviewed workflow on main
        run: |
          if [ "$GITHUB_REPOSITORY" != smithersai/smithers ] || [ "$GITHUB_REF" != refs/heads/main ] \
            || [ "$GITHUB_WORKFLOW_REF" != "smithersai/smithers/.github/workflows/npm-dist-tag.yml@refs/heads/main" ]; then
            echo "::error::A dist-tag moves only from smithersai/smithers' own npm-dist-tag.yml at refs/heads/main; this run is on $GITHUB_REF."
            exit 1
          fi
        shell: bash
      # The release scripts only: the package list and the request check.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .smithers/flows/release
      # No registry-url here: the request check below is a script of the
      # checkout, and it runs before this job holds any registry credential.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.5.0
      - name: Check the request
        run: node .smithers/flows/release/dist-tag-request.mjs
        shell: bash
      # From here on the job runs npm and no script of the checkout. This
      # setup writes the .npmrc that sends NODE_AUTH_TOKEN with every request,
      # and the registry refuses even a public read made with its placeholder
      # token, so each npm step carries the real one.
      - name: Configure the npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.5.0
          registry-url: https://registry.npmjs.org
      - name: Check the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          published="$(npm view "$PACKAGE@$VERSION" version --registry https://registry.npmjs.org --loglevel error)"
          if [ "$published" != "$VERSION" ]; then
            echo "::error::$PACKAGE@$VERSION is not on npm."
            exit 1
          fi

          before="$(npm dist-tag ls "$PACKAGE" --registry https://registry.npmjs.org --loglevel error)"
          echo "dist-tags of $PACKAGE before:"
          printf '%s\n' "$before"

          current_latest="$(awk -F': ' '$1 == "latest" { print $2 }' <<<"$before")"
          if [ "$TAG" = latest ] && [[ "$current_latest" == 0.* ]] && [ "$REPLACE_ZERO_LATEST" != true ]; then
            echo "::error::$PACKAGE latest is $current_latest, a 0.x version that 0.x users install. Dispatch with replaceZeroLatest=true to move it anyway."
            exit 1
          fi
        shell: bash
      - name: Move the dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "$PACKAGE@$VERSION" "$TAG" --registry https://registry.npmjs.org --loglevel error
        shell: bash
      - name: Show the dist-tags after
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          after="$(npm dist-tag ls "$PACKAGE" --registry https://registry.npmjs.org --loglevel error)"
          echo "dist-tags of $PACKAGE after:"
          printf '%s\n' "$after"
          moved="$(awk -F': ' -v tag="$TAG" '$1 == tag { print $2 }' <<<"$after")"
          if [ "$moved" != "$VERSION" ]; then
            echo "::error::$TAG of $PACKAGE reads '$moved', not $VERSION."
            exit 1
          fi
        shell: bash
