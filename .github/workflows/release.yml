name: Release

on:
  push:
    tags:
      - "v*"
  # Rehearsal path. A dispatched run executes every gate, packs the release set,
  # smoke-tests the tarballs, and skips publication while dryRun is true. npm
  # versions are immutable, so this is the only way to exercise the workflow
  # end to end without spending the version under test.
  workflow_dispatch:
    inputs:
      releaseTag:
        description: "Tag to validate, for example v1.0.0-rc.0; with sourceRef, the intended version label. Defaults to the dispatched ref."
        type: string
        required: false
        default: ""
      sourceRef:
        description: "Optional full commit SHA on main for a fresh dry run. Requires dryRun=true and no archived candidate IDs."
        type: string
        required: false
        default: ""
      dryRun:
        description: "Run every gate and skip the npm publish step."
        type: boolean
        required: false
        default: true
      candidateRunId:
        description: "Restore a tested candidate from this completed Release run; set candidateArtifactId too."
        type: string
        required: false
        default: ""
      candidateArtifactId:
        description: "Immutable release-candidate artifact ID from candidateRunId; empty builds a new candidate."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: validate, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # A tag push releases the tag it pushed. A dispatched run releases the tag
      # it was given, because github.ref_name is a branch name on that path.
      # With sourceRef, this is only the intended version label for a dry run.
      RELEASE_TAG: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
      # Publication is skipped only on a dispatched dry run. A tag push always
      # publishes: `inputs.dryRun` is absent there, so this resolves to false.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
      SOURCE_REF: ${{ inputs.sourceRef }}
      CANDIDATE_RUN_ID: ${{ inputs.candidateRunId }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidateArtifactId }}
    steps:
      # A re-run replays every gate, rebuilds and repacks a candidate, and then
      # fails at the archive step: actions/upload-artifact refuses a second
      # `release-candidate-<run-id>` inside one run. The retry that works is a
      # new dispatch that restores the archived candidate (scripts/release-resume.md),
      # so a re-run attempt is refused before the first gate spends an hour.
      - name: Refuse a re-run attempt
        if: github.run_attempt != '1'
        run: |
          echo "Run attempt $GITHUB_RUN_ATTEMPT would rebuild the candidate and then collide with this run's release-candidate-$GITHUB_RUN_ID artifact." >&2
          echo "Dispatch Release again with releaseTag=$RELEASE_TAG instead. To resume the archived candidate, pass candidateRunId=$GITHUB_RUN_ID and candidateArtifactId=<the release-candidate-$GITHUB_RUN_ID artifact ID> (scripts/release-resume.md)." >&2
          exit 1
      # This guard is inline so the workflow can validate an older source SHA
      # that does not contain a newly added release helper.
      - name: Validate explicit dry-run source
        run: |
          if [ -z "$SOURCE_REF" ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$DRY_RUN" != true ] \
            || [ -n "$CANDIDATE_RUN_ID" ] || [ -n "$CANDIDATE_ARTIFACT_ID" ]; then
            echo "sourceRef is allowed only for a fresh workflow_dispatch dry run without archived candidate IDs." >&2
            exit 1
          fi
          if ! [[ "$SOURCE_REF" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "sourceRef must be a full 40- or 64-character hexadecimal commit SHA." >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "An explicit sourceRef requires releaseTag in v<version> format as the intended version label." >&2; exit 1 ;;
          esac
        shell: bash
      # Full history and tags. The changelog gate below reads the commit range
      # from the previous v* tag to the tag being released, and the default
      # shallow checkout carries neither the tags nor the commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.sourceRef != '' && inputs.sourceRef || inputs.releaseTag != '' && inputs.releaseTag || github.ref }}
      - name: Verify explicit dry-run source
        run: |
          if [ -z "$SOURCE_REF" ]; then exit 0; fi
          actual_source="$(git rev-parse --verify HEAD)"
          requested_source="$(printf '%s' "$SOURCE_REF" | tr 'A-F' 'a-f')"
          if [ "$actual_source" != "$requested_source" ]; then
            echo "The checked-out source does not match sourceRef." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_source" refs/remotes/origin/main; then
            echo "sourceRef must be reachable from origin/main." >&2
            exit 1
          fi
        shell: bash
      # actionlint models GitHub's per-key expression-context rules, including
      # the fact that `runner` is available to steps but not a job-level env.
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
        with:
          args: ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/release-auth.yml .github/workflows/apps-deploy.yml .github/workflows/canary.yml .github/workflows/pr-review.yml .github/workflows/reliability.yml .github/workflows/mirror-sync.yml"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.0
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Enable the containerd image store
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ] \
            && [ "$(docker info --format '{{.Driver}}' 2>/dev/null)" != overlayfs ]; then
            if [ -f /etc/docker/daemon.json ]; then
              merged="$(jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json)"
            else
              merged='{ "features": { "containerd-snapshotter": true } }'
            fi
            printf '%s\n' "$merged" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
            docker info --format 'docker storage driver: {{.Driver}}'
          fi
        shell: bash
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install certified npm
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: bash
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate archived candidate selection
        run: node scripts/restore-release.mjs --check-inputs
      - name: Install jj
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Install ripgrep
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: ripgrep@14.1.1
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: bash
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tags must use the v<version> format." >&2; exit 1 ;;
          esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          # Smithers 1.0 gives every public first-party package one
          # synchronized version, so the engine and agent groups release
          # together. Tooling is private and never packed. A private manifest
          # is still group-checked, so a package cannot leave the train by
          # dropping its group.
          # The member list comes from `pnpm-workspace.yaml` through the one
          # reader every gate shares, never from a shell glob. Packages nest —
          # a granular package lives inside the product package it belongs to,
          # three directory levels deep — and a glob deep enough to reach one
          # also matches the generated `dist/cjs/package.json` a built package
          # ships, which carries no group and would fail this loop on a build
          # artifact. No package is named here: the published set is the pack
          # manifest, and this loop only checks what the workspace declares.
          for directory in $(node scripts/workspace-packages.mjs --library-dirs); do
            manifest="$directory/package.json"
            package_group="$(node -p "require('./' + process.argv[1]).smthrs?.group ?? ''" "$manifest")"
            case "$package_group" in
              engine|agent) ;;
              tooling) continue ;;
              *) echo "$manifest has missing or unknown smthrs.group '$package_group'." >&2; exit 1 ;;
            esac
            package_private="$(node -p "String(require('./' + process.argv[1]).private === true)" "$manifest")"
            if [ "$package_private" = "true" ]; then continue; fi
            package_version="$(node -p "require('./' + process.argv[1]).version" "$manifest")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "$manifest has version $package_version; expected $RELEASE_VERSION." >&2
              exit 1
            fi
          done
          # Tooling is private and never packed, but it pins the same version
          # and the workspace: ranges the packed manifests resolve through, so
          # the checker covers every versioned manifest and source, not only
          # the two published groups the loop above reads.
          node scripts/set-release-version.mjs --check "$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      # The changelog is generated from the commit range, so a release whose
      # section is missing or stale is a release nobody wrote up. Failing here
      # costs a re-tag; failing after the publish step costs an immutable npm
      # version whose changelog says nothing about it.
      - name: Release changelog section
        run: node scripts/generate-changelog.mjs --check --version "$RELEASE_VERSION"
      # The gate roster below is the required CI `test` job, copied verbatim
      # from the generated .github/workflows/ci.yml, plus the fault matrix the
      # required `e2e-faults` job runs. A release that drove the recursive
      # per-package scripts instead proved a different thing than CI proves,
      # and drifted: those runners need none of the toolchain above, so the
      # 1.0.0-rc.0 dry run reached the std package's ripgrep conformance suite
      # on a runner with no rg binary and failed 25 cases. pack-release.test.mjs
      # compares these blocks against ci.yml, so the copy cannot go stale in
      # silence, and the toolchain block above is a one-line copy per bump.
      - name: Examples
        run: pnpm exec smthrs ci '//examples/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Workspace targets
        run: pnpm exec smthrs ci '//packages/...' --jobs 2 --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Script gates
        run: pnpm exec smthrs test '//scripts/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Repository flows
        run: pnpm exec smthrs test '//flows:pack' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Public export JSDoc
        run: pnpm exec smthrs lint '//:jsdocTree' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Script lint
        run: pnpm exec smthrs lint '//scripts:lint' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: JSDoc rule harness
        run: pnpm exec smthrs test '//:jsdocRules' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Factory harness
        run: pnpm exec smthrs test '//:factoryHarness' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Agent eval suite (offline, baseline-gated)"
        run: pnpm exec smthrs test '//evals/agent:test' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Agent eval typecheck
        run: pnpm exec smthrs build '//evals/agent:check' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Authoring eval dataset (offline)"
        run: pnpm exec smthrs test '//evals/authoring:test' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Authoring eval typecheck
        run: pnpm exec smthrs build '//evals/authoring:check' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: SWE-bench offline fixtures
        run: pnpm exec smthrs test '//evals/swebench:offline' --jobs 1 --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: SWE-bench rig typecheck
        run: pnpm exec smthrs build '//evals/swebench:check' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: UI typecheck
        run: pnpm exec smthrs build '//apps/ui:check' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: UI unit tests
        run: pnpm exec smthrs test '//apps/ui:unitTests' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Server typecheck and tests
        run: pnpm exec smthrs ci '//apps/server/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Review app and workers
        run: pnpm exec smthrs ci '//apps/review/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Bug worker
        run: pnpm exec smthrs ci '//apps/bug-worker/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Status site
        run: pnpm exec smthrs ci '//apps/status-site/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Project copy drift
        run: pnpm exec smthrs lint '//:projectCopy' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Site
        run: pnpm exec smthrs ci '//apps/site/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Package docs sites
        run: pnpm exec smthrs ci '//apps/docs/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Review eval suite (offline, baseline-gated)"
        run: pnpm exec smthrs test '//evals/review-seeded-bugs/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Review eval typecheck
        run: pnpm exec smthrs build '//evals/review-seeded-bugs:check' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: "Recommend eval suite (offline, baseline-gated)"
        run: pnpm exec smthrs test '//evals/recommend/...' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Recommend eval typecheck
        run: pnpm exec smthrs build '//evals/recommend:check' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Generated workflow drift
        run: pnpm exec smthrs lint '//:ci' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Factory projection drift
        run: pnpm exec smthrs lint '//:factoryProjection' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Target index drift
        run: pnpm exec smthrs lint '//:targetIndex' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      # Ordinary workspace CI omits this exclusive tier; the explicit label opts in.
      - name: Exclusive fault matrix
        run: pnpm exec smthrs test '//packages/...:faults' --jobs 1 --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      # Release-only gates. Neither is in the required CI roster: the
      # disaster-recovery suite is a pinned target rather than part of its
      # package's `ci`, and the version-coherence suite is named here so a
      # rehearsal can run it alone.
      - name: Disaster-recovery script test
        run: pnpm exec smthrs test '//packages/smithers/flows/engine-store:disasterRecovery' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Release version coherence
        run: pnpm exec smthrs test '//scripts:releaseVersion' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Build-script unit tests
        run: pnpm exec smthrs test '//crates/flows-jj:buildScript' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Rebuild and byte-compare flows_jj.wasm
        run: pnpm exec smthrs test '//crates/flows-jj:wasmReproducibility' --verbose
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_READ_TOKEN: "${{ secrets.SMITHERS_CACHE_READ_TOKEN }}"
          SMITHERS_CACHE_NAMESPACE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
      - name: Build all workspaces from clean artifacts
        if: env.CANDIDATE_RUN_ID == ''
        run: node scripts/build-release.mjs
      # Pack from staging manifests whose exports point at built artifacts.
      # Repository manifests retain Effect's source-first export shape.
      - name: Pack and smoke-test release artifacts
        if: env.CANDIDATE_RUN_ID == ''
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/release-smoke-evidence
        run: |
          test "$(node --version)" = 'v22.19.0'
          test "$(npm --version)" = '11.16.0'
          mkdir -p "$SMOKE_EVIDENCE_DIR"
          node scripts/pack-release.mjs "$PACK_DIR"
          node scripts/smoke-release.mjs "$PACK_DIR"
          cp "$PACK_DIR/smoke-evidence.json" "$SMOKE_EVIDENCE_DIR/node22.json"
      # Exercise the second advertised Node line from its minimum version,
      # using the identical tarballs and a fresh isolated consumer installation.
      - name: Install the supported Node 24 floor
        if: env.CANDIDATE_RUN_ID == ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
      - name: Install certified npm for Node 24
        if: env.CANDIDATE_RUN_ID == ''
        run: |
          npm install --global 'npm@11.16.0' --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = '11.16.0'
        shell: bash
      - name: Smoke release artifacts on the Node 24 floor
        if: env.CANDIDATE_RUN_ID == ''
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/release-smoke-evidence
        run: |
          test "$(node --version)" = 'v24.11.0'
          test "$(npm --version)" = '11.16.0'
          node scripts/smoke-release.mjs "$PACK_DIR"
          cp "$PACK_DIR/smoke-evidence.json" "$SMOKE_EVIDENCE_DIR/node24.json"
      - name: Restore and verify archived release candidate
        if: env.CANDIDATE_RUN_ID != ''
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-release.mjs "$PACK_DIR"
      # The package set and its order come from scripts/pack-release.mjs, which
      # derives membership from the `engine` and `agent` smthrs.group values
      # and order from the workspace dependency edges. Reading manifest.json
      # publishes exactly what the pack step produced, in the packed order, so
      # the lists cannot drift or accidentally include a private package.
      #
      # The plan is computed on both paths, so a dry run reports the exact set,
      # order, version, and dist-tag a real run would publish.
      - name: Archive tested release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-packs
          if-no-files-found: error
          retention-days: 30
      - name: Collect ci-test-tier-evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-test-tier-evidence"
          for f in '/tmp/smithers-ci-inventory-'*'.json'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-mutations-'*''; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-benchmark-'*''; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-runner-'*'.log'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
          for f in '/tmp/smithers-runner-'*'.json'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/ci-test-tier-evidence"; fi; done
      - name: Upload ci-test-tier-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-test-tier-evidence
          path: "${{ runner.temp }}/ci-test-tier-evidence"
          if-no-files-found: ignore
      - name: Upload release runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-smoke-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-smoke-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Compute the publish plan
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
        run: |
          release_version="${RELEASE_TAG#v}"
          # A prerelease never takes `latest`: `npm install smthrs` and every
          # range that tracks the tag must keep resolving 0.35.0 until 1.0.0 is
          # final. Prereleases publish under `next`, which is also pinned in each
          # manifest's publishConfig.tag (the release runbook in Smithers-Ops).
          publish_tag="latest"
          case "$release_version" in *-*) publish_tag="next" ;; esac
          node -e '
            const { readFileSync } = require("node:fs")
            const packed = JSON.parse(readFileSync(process.env.PACK_DIR + "/manifest.json", "utf8"))
            for (const entry of packed) console.log(entry.name + " " + entry.filename)
          ' > "$PUBLISH_ORDER"
          echo "PUBLISH_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PUBLISH_DIST_TAG=$publish_tag" >> "$GITHUB_ENV"
          echo "Publish plan for $release_version on the $publish_tag dist-tag:"
          cat "$PUBLISH_ORDER"
      - name: Publish packages in dependency order
        if: env.DRY_RUN != 'true' && !inputs.sourceRef
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
          # Trusted publishing (id-token: write) is the primary credential and
          # needs nothing here. First publication of a new package name needs
          # the repository token because npm cannot preconfigure trusted
          # publishing for a name that does not exist yet. The token remains a
          # fallback for existing names, and provenance stays enabled below.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/publish-release.mjs "$PACK_DIR"
      # publish-release.mjs rewrites publish-receipt.json after every package
      # it publishes. The candidate archive above predates publication, so a
      # train that stops halfway would otherwise leave the only record of
      # which names landed on the runner's disk.
      - name: Upload the publish receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-publish-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/release-packs/publish-receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Report the skipped publication
        if: env.DRY_RUN == 'true'
        env:
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
        run: |
          echo "Dry run: every current gate ran; candidate build/smoke or archived-candidate verification passed. Nothing was published."
          echo "A real run would publish these at $PUBLISH_VERSION on the $PUBLISH_DIST_TAG dist-tag:"
          cat "$PUBLISH_ORDER"
