version: "2"
# cluster/sqlc_schema.sql is generated from product migrations and private cluster sources.
# Run generate_schema.py before sqlc generate; never edit cluster/sqlc_schema.sql directly.
sql:
  - engine: "postgresql"
    schema: "cluster/sqlc_schema.sql"
    queries: "cluster/queries/"
    strict_function_checks: true
    gen:
      go:
        package: "clusterdb"
        out: "../internal/clusterdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
          # This control deliberately starts at PostgreSQL infinity. Keep the
          # richer pgtype representation for its generated read/attest APIs.
          - column: "storage_legacy_capability_horizons.valid_until"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "tsvector"
            go_type: "string"
          - db_type: "pg_catalog.tsvector"
            go_type: "string"
          - column: "users.search_vector"
            go_type: "string"
            go_struct_tag: 'json:"-"'
          - column: "repositories.search_vector"
            go_type: "string"
            go_struct_tag: 'json:"-"'
          - column: "issues.search_vector"
            go_type: "string"
            go_struct_tag: 'json:"-"'
